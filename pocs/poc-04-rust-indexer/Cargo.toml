[package]
name = "rust-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
notify = "8.2.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tree-sitter = "0.27.1"
tree-sitter-typescript = "0.23.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
